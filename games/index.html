<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Game bổ trợ</title><link rel="stylesheet" href="../shared/style.css">
<style>body{display:block;overflow:auto;padding:16px}main{max-width:820px;margin:auto}
.g{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:18px;box-shadow:0 4px 0 var(--line);padding:14px 18px;margin:10px 0;text-decoration:none;color:var(--ink);font-size:clamp(18px,2.6vw,26px)}
.g span{font-size:clamp(34px,6vw,56px)}.g.t{outline:4px solid var(--a)}.g small{color:var(--mut);display:block;font-size:.65em}</style></head>
<body><main><h1>🎮 Game bổ trợ</h1>
<p>Chủ đề: <select id="tp" style="font:inherit;padding:6px;border-radius:10px"></select> <a href="../index.html">🏠 Mục lục bài</a></p>
<div id="gl"></div></main>
<script src="topics/list.js"></script>
<script>
const GAMES=[["memory","🃏","Lật thẻ ghép đôi"],["missing","🙈","What’s missing?"],["tap","👆","Chạm đúng hình"],["sort","🧺","Phân loại vào rổ"],["flash","🎭","Flashcard và diễn"]];
const today=Math.floor(Date.now()/864e5)%GAMES.length,tp=document.getElementById("tp");
tp.innerHTML=TOPIC_LIST.map(([f,n])=>`<option value="${f}">${n}</option>`).join("");
function draw(){document.getElementById("gl").innerHTML=GAMES.map(([g,e,n],k)=>`<a class="g${k===today?" t":""}" href="play.html?g=${g}&t=${tp.value}"><span>${e}</span><div>${n}${k===today?"<small>⭐ Game hôm nay</small>":""}</div></a>`).join("")}
tp.onchange=draw;draw();
</script></body></html>
